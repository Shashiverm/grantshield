<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gs-fav-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a121e" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050910" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="gs-fav-border" x1="12" y1="6" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glow Gradient -->
    <radialGradient id="gs-fav-glow" cx="32" cy="28" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Checkmark & Core Gradient -->
    <linearGradient id="gs-fav-check" x1="22" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#00e599" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="gs-fav-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Shield -->
  <circle cx="32" cy="30" r="22" fill="url(#gs-fav-glow)" />

  <!-- Shield Outer Base -->
  <path
    d="M32 4L12 12V28C12 43 20.5 53.5 32 59C43.5 53.5 52 43 52 28V12L32 4Z"
    fill="url(#gs-fav-bg)"
    stroke="url(#gs-fav-border)"
    stroke-width="2.5"
    stroke-linejoin="round"
    filter="url(#gs-fav-shadow)"
  />

  <!-- Inner Geometric Facet -->
  <path
    d="M32 10L17 16V27C17 38.5 23.5 47 32 51.5C40.5 47 47 38.5 47 27V16L32 10Z"
    fill="#0f2027"
    fill-opacity="0.75"
    stroke="#1e3a47"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- ZK Cryptographic Keyhole Portal (Top circle & subtle notch) -->
  <circle cx="32" cy="24" r="5" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
  <circle cx="32" cy="24" r="2" fill="#34d399" />

  <!-- Dynamic Verification Checkmark with Rounded Caps -->
  <path
    d="M23 33.5L28.5 39L41 24.5"
    stroke="url(#gs-fav-check)"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Cryptographic Sparkle / Star Node (Merit & Privacy) -->
  <polygon points="32,7 33,9.5 35.5,10.5 33,11.5 32,14 31,11.5 28.5,10.5 31,9.5" fill="#34d399" />
</svg>
